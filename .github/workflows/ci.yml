name: Trace2Inv CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  IMAGE_NAME: trace2inv

jobs:
  # ── L1: Dockerfile linting ───────────────────────────────────────────────────
  lint-dockerfile:
    name: L1 – Dockerfile lint (hadolint)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Run hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf  # v3.1.0
        with:
          dockerfile: Dockerfile
          # DL3008 – apt version pinning: acceptable for research reproducibility images
          # DL3013 – pip version pinning: managed via pinned requirements.txt
          # SC2015 – A&&B||C shell pattern: not present after fix but suppressed for safety
          ignore: DL3008,DL3013,SC2015

  # ── L2: Docker image build ───────────────────────────────────────────────────
  build-image:
    name: L2 – Docker build
    runs-on: ubuntu-22.04
    needs: lint-dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0

      - name: Build image (no push)
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1  # v6.16.0
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── L3: Import smoke test (offline, no secrets) ──────────────────────────────
  smoke-test:
    name: L3 – Smoke test (package imports)
    runs-on: ubuntu-22.04
    needs: build-image
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0

      - name: Build image for smoke test
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1  # v6.16.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha

      - name: Verify all packages from requirements.txt are importable
        # Checks exactly the packages listed in requirements.txt.
        # web3 is intentionally absent – it arrives transitively via slither_analyzer.
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:ci python3.10 -c "
          import sys, importlib.util
          pkgs = ['eth_abi', 'hexbytes', 'networkx', 'numpy', 'packaging',
                  'requests', 'slither', 'tinyrpc', 'toml']
          missing = [p for p in pkgs if importlib.util.find_spec(p) is None]
          [print(f'  ok  {p}') for p in pkgs if p not in missing]
          [print(f'  MISSING  {p}', file=sys.stderr) for p in missing]
          sys.exit(1) if missing else print('All packages importable.')
          "

  # ── L4: Offline invariant run using pre-cached pickle data ──────────────────
  # Reproduces the verification step from the upstream README (Step 2):
  #   python3.10 main.py AC
  #
  # Known limitation: inferAccessControl() calls Etherscan to fetch contract
  # ABIs even when using pre-cached pickle data. Without an API key the tool
  # crashes mid-run with JSONDecodeError. This is a reproducibility barrier
  # documented in the README – the tool is not fully offline.
  #
  # This job verifies:
  #   (1) The upstream image pulls and runs successfully
  #   (2) The pickle data loads correctly (benchmark names appear in output)
  #   (3) The tool reaches the inference stage before failing on Etherscan
  offline-run:
    name: L4 – Offline invariant run (python3.10 main.py AC)
    runs-on: ubuntu-22.04
    needs: smoke-test
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Pull upstream Docker image
        # The pre-cached pickle files (data/) are only available in the Docker
        # image due to GitHub file size limits (stated in upstream README).
        run: docker pull zhiychen597/trace2inv-artifact-fse2024:latest

      - name: Run AC invariant inference (upstream README Step 2)
        # Allow non-zero exit – the tool crashes on Etherscan without API key.
        # We verify correct behaviour via output content, not exit code.
        run: |
          docker run --rm \
            zhiychen597/trace2inv-artifact-fse2024:latest \
            python3.10 main.py AC 2>&1 | tee ac_run.log || true

      - name: Verify pickle data loads and inference stage is reached
        # These four strings confirm:
        #   - data/executionTable.pkl loaded correctly (benchmark names printed)
        #   - main.py reached inferAccessControl (invariant stage started)
        # The subsequent Etherscan crash is expected without an API key.
        run: |
          grep -q "RariCapital2_1 has one function call with several transfers" ac_run.log \
            || { echo "FAIL: pickle data did not load correctly"; exit 1; }
          grep -q "Yearn1 has one function call with several transfers" ac_run.log \
            || { echo "FAIL: pickle data did not load correctly"; exit 1; }
          grep -q "Invariant: access control" ac_run.log \
            || { echo "FAIL: inference stage was not reached"; exit 1; }
          grep -q "benchmark RoninNetwork" ac_run.log \
            || { echo "FAIL: inference stage was not reached"; exit 1; }
          echo "PASS: pickle data loaded and inference stage reached."
          echo "NOTE: tool crashes on Etherscan API call (expected – no key in CI)."

      - name: Upload AC run log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: trace2inv-ac-run-log
          path: ac_run.log
          retention-days: 30
